<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>That Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(180deg, #18110b 0%, #000000 100%); 
            color: #FFD700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            user-select: none;
            overflow: hidden;
        }

        #level {
            font-size: 24px;
            color: #ccc;
            margin-bottom: 5px;
        }

        #score {
            font-size: 60px;
            margin-bottom: 25px;
            font-weight: 900;
            text-shadow: 0 0 10px #FFD700, 0 0 20px rgba(255, 165, 0, 0.5); 
        }

        #coin {
            width: 250px; 
            height: 250px;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 0 20px #FFD700, 0 0 30px rgba(255, 165, 0, 0.7); 
            border-radius: 50%;
        }
        
        #coin:active {
            transform: scale(0.90);
        }

        /* Kaydet Butonu Stili - Yeşil ve Belirgin */
        #saveBtn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        #saveBtn:active {
            background-color: #218838;
            transform: scale(0.95);
        }

    </style>
</head>
<body>
    
    <div id="level">Seviye: BRONZE 🥉</div>
    <div id="score">0</div>
    
    <img id="coin" src="https://em-content.zobj.net/source/apple/355/coin_1fa99.png" alt="Tıklama Coini">
    
    <button id="saveBtn">💾 KAYDET</button>

    <script>
        const tg = Telegram.WebApp;
        tg.expand();

        const scoreEl = document.getElementById("score");
        const levelEl = document.getElementById("level");
        const coin = document.getElementById("coin");
        const saveBtn = document.getElementById("saveBtn"); // Kaydet butonu

        let score = Number(localStorage.getItem("score") || 0);

        updateUI(); // Sayfa yüklenince puanı göster

        function updateUI() {
            scoreEl.innerText = score.toLocaleString(); // Puanı göster
            
            let currentLevel = 'BRONZE 🥉';
            if (score >= 1_000_000) currentLevel = "PLATİNUM 💎";
            else if (score >= 100_000) currentLevel = "GOLD 🥇";
            else if (score >= 10_000) currentLevel = "SILVER 🥈";
            
            levelEl.innerText = `Seviye: ${currentLevel}`;
        }

        // Tıklama olayını yönetme
        coin.addEventListener('click', () => {
            score += 1; // Her tıklamada 1 puan artır
            localStorage.setItem("score", score); // Puanı kaydet
            updateUI(); 
            
            // Varsa titreşim ekle
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        });

        // KRİTİK DÜZELTME: KAYDET BUTONUNA TIKLANDIĞINDA VERİYİ GÖNDERME
        saveBtn.addEventListener('click', () => {
            // 1. JSON formatında puanı hazırla
            const dataToSend = JSON.stringify({ score: score }); 
            
            // 2. Veriyi bot'a gönder (Backend'imizdeki bot.on('web_app_data') burayı dinliyor)
            tg.sendData(dataToSend);
            
            // 3. Web App penceresini kapat
            tg.close(); 
        });

    </script>
</body>
</html>
