<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>That Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1f1f2e 0%, #000000 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        /* Üst Bilgi Paneli */
        .header {
            display: flex;
            width: 90%;
            justify-content: space-between;
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .info-box {
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }
        .info-box span {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        /* Skor ve Seviye */
        .score-container {
            text-align: center;
            margin-top: 20px;
        }
        .level-text {
            font-size: 14px;
            color: #FFD700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        #score {
            font-size: 64px;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Coin Alanı */
        .coin-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        #coin {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            /* Multi-touch için önemli */
            -webkit-tap-highlight-color: transparent;
            object-fit: cover;
        }
        #coin:active {
            transform: scale(0.95);
        }

        /* Boost Efekti */
        .boost-active #coin {
            box-shadow: 0 0 80px rgba(255, 69, 0, 0.8); /* Kırmızı parıltı */
            border: 2px solid #ff4500;
        }

        /* Alt Kontroller */
        .controls {
            width: 90%;
            margin-bottom: 30px;
        }

        /* Enerji Barı */
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f39c12, #f1c40f);
            border-radius: 6px;
            transition: width 0.2s;
        }

        /* Butonlar */
        .buttons-row {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-save { background-color: #2ecc71; }
        .btn-boost { background-color: #e74c3c; position: relative; overflow: hidden; }
        .btn-invite { background-color: #3498db; }

        .boost-timer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            display: none;
        }

        /* Tıklama Animasyonu (+1 yazısı) */
        .click-anim {
            position: absolute;
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Üst Bilgi -->
    <div class="header">
        <div class="info-box">
            <span>BRONZE</span>
            Lig
        </div>
        <div class="info-box">
            <span id="profit-hour">0</span>
            Saatlik Kazanç
        </div>
        <div class="info-box">
            <span id="level-display">1</span>
            Seviye
        </div>
    </div>

    <!-- Skor -->
    <div class="score-container">
        <div id="score">0</div>
        <div class="level-text">BAKİYE</div>
    </div>

    <!-- Coin -->
    <div class="coin-wrapper">
        <img id="coin" src="https://cdn-icons-png.flaticon.com/512/217/217853.png" alt="Coin">
    </div>

    <!-- Alt Kontroller -->
    <div class="controls">
        
        <!-- Enerji -->
        <div class="energy-info">
            <span>⚡ Enerji</span>
            <span id="energy-text">1000 / 1000</span>
        </div>
        <div class="progress-bar-bg">
            <div id="energy-bar" class="progress-bar-fill"></div>
        </div>

        <!-- Butonlar -->
        <div class="buttons-row">
            <button id="inviteBtn" class="btn btn-invite">📢 Davet</button>
            <button id="saveBtn" class="btn btn-save">💾 Kaydet</button>
            <button id="boostBtn" class="btn btn-boost">
                🚀 Boost (3/3)
                <div id="boost-overlay" class="boost-timer">60</div>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Kullanıcı Adı Ayarı
        const botUsername = 'ThatsCoin_bot'; 
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 'test-user';

        // Elementler
        const scoreEl = document.getElementById('score');
        const coinEl = document.getElementById('coin');
        const energyBarEl = document.getElementById('energy-bar');
        const energyTextEl = document.getElementById('energy-text');
        const boostBtn = document.getElementById('boostBtn');
        const boostOverlay = document.getElementById('boost-overlay');
        const coinWrapper = document.querySelector('.coin-wrapper');

        // Oyun Değişkenleri
        let score = Number(localStorage.getItem('score')) || 0;
        let energy = Number(localStorage.getItem('energy')) || 1000;
        let maxEnergy = 1000;
        let dailyBoosts = Number(localStorage.getItem('dailyBoosts')) || 3;
        let lastBoostDate = localStorage.getItem('lastBoostDate');
        
        let isBoostActive = false; // Boost durumu

        // Günlük Boost Sıfırlama
        const today = new Date().toDateString();
        if (lastBoostDate !== today) {
            dailyBoosts = 3;
            localStorage.setItem('dailyBoosts', 3);
            localStorage.setItem('lastBoostDate', today);
        }

        updateUI();

        // ----- ÇOKLU DOKUNMA (MULTI-TOUCH) MANTIĞI -----
        
        // 'click' yerine 'touchstart' kullanıyoruz çünkü multi-touch desteklemeli
        coinEl.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Sayfanın kaymasını engelle

            // Kaç parmak dokunduysa o kadar işlem yap
            // Boost aktifse enerji harcama, değilse harca.
            
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                handleTap(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        function handleTap(x, y) {
            // Enerji kontrolü (Boost aktifse enerjiye bakma!)
            if (!isBoostActive && energy <= 0) return;

            // Puan artır
            score++;
            
            // Enerji azalt (Boost aktif DEĞİLSE)
            if (!isBoostActive) {
                energy--;
            }

            updateUI();
            showFloatingText(x, y);
            animateCoin();

            // Titreşim (Haptic)
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // ----- BOOST SİSTEMİ -----
        
        boostBtn.addEventListener('click', () => {
            if (isBoostActive) return; // Zaten çalışıyorsa çık
            if (dailyBoosts <= 0) {
                tg.showAlert("Bugünkü boost hakların bitti! Yarın gel.");
                return;
            }

            activateBoost();
        });

        function activateBoost() {
            isBoostActive = true;
            dailyBoosts--;
            localStorage.setItem('dailyBoosts', dailyBoosts);
            updateUI();

            // Görsel efektler
            document.body.classList.add('boost-active');
            boostOverlay.style.display = 'flex';
            
            let timeLeft = 60; // 60 Saniye
            boostOverlay.innerText = timeLeft;

            const timer = setInterval(() => {
                timeLeft--;
                boostOverlay.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    deactivateBoost();
                }
            }, 1000);
        }

        function deactivateBoost() {
            isBoostActive = false;
            document.body.classList.remove('boost-active');
            boostOverlay.style.display = 'none';
            tg.showAlert("Boost bitti!");
        }

        // ----- DİĞER FONKSİYONLAR -----

        function updateUI() {
            scoreEl.innerText = score.toLocaleString();
            energyTextEl.innerText = `${energy} / ${maxEnergy}`;
            energyBarEl.style.width = (energy / maxEnergy * 100) + '%';
            
            // Boost buton metni güncelle
            boostBtn.innerHTML = `🚀 Boost (${dailyBoosts}/3) <div id="boost-overlay" class="boost-timer" style="display:${isBoostActive ? 'flex' : 'none'}"></div>`;
            if(isBoostActive) {
                 // Timer çalışırken içeriği js ile yönetiyoruz, burayı ezmemesi lazım
                 // Basitlik için timer metnini interval içinde yönetiyoruz.
            }
            
            // Verileri kaydet
            localStorage.setItem('score', score);
            localStorage.setItem('energy', energy);
        }

        function showFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'click-anim';
            text.innerText = '+1';
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        function animateCoin() {
            // Basit bir küçülme efekti CSS active ile yapılıyor zaten
            // Ekstra JS animasyonu gerekirse buraya
        }

        // Enerji Yenileme (Her saniye)
        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                updateUI();
            }
        }, 1000);

        // Kaydet Butonu
        document.getElementById('saveBtn').addEventListener('click', () => {
            const data = JSON.stringify({ score: score });
            tg.sendData(data);
            tg.close();
        });

        // Davet Butonu
        document.getElementById('inviteBtn').addEventListener('click', () => {
            const link = `https://t.me/${botUsername}?start=${userId}`;
            const msg = `That Coin oyna ve kazan! Link: ${link}`;
            const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        });

    </script>
</body>
</html>
