<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tıkla Kazan</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: black; 
            color: white; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: sans-serif;
        }
        #coin {
            font-size: 100px;
            cursor: pointer;
            user-select: none;
        }
        #score { font-size: 40px; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="score">0</div>
    <div id="coin">💰</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        let puan = 0;
        const coin = document.getElementById('coin');
        const scoreYazi = document.getElementById('score');

        coin.addEventListener('click', () => {
            puan++;
            scoreYazi.innerText = puan;
            // Titreşim
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        });
    </script>
</body>
</html>
