<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>That Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1f1f2e 0%, #000000 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        /* Üst Bilgi Paneli */
        .header {
            display: flex;
            width: 90%;
            justify-content: space-between;
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .info-box {
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }
        .info-box span {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        /* Skor ve Seviye */
        .score-container {
            text-align: center;
            margin-top: 20px;
        }
        .level-text {
            font-size: 14px;
            color: #FFD700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        #score {
            font-size: 64px;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Coin Alanı */
        .coin-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        #coin {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            object-fit: cover;
        }
        #coin:active {
            transform: scale(0.95);
        }

        /* Boost Efekti */
        .boost-active #coin {
            box-shadow: 0 0 80px rgba(255, 69, 0, 0.8); /* Kırmızı parıltı */
            border: 2px solid #ff4500;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Alt Kontroller */
        .controls {
            width: 90%;
            margin-bottom: 30px;
        }

        /* Enerji Barı */
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f39c12, #f1c40f);
            border-radius: 6px;
            transition: width 0.2s;
        }

        /* Butonlar */
        .buttons-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-save { background-color: #2ecc71; }
        .btn-boost { background-color: #e74c3c; position: relative; overflow: hidden; }
        .btn-invite { background-color: #3498db; }
        .btn-wallet { background-color: #9b59b6; width: 100%; margin-top: 10px;} 

        .boost-timer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            display: none;
        }

        /* Tıklama Animasyonu (+1 yazısı) */
        .click-anim {
            position: absolute;
            color: white;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Üst Bilgi -->
    <div class="header">
        <div class="info-box">
            <span id="level-display">BRONZE</span>
            Seviye
        </div>
        <div class="info-box">
            <span id="profit-hour">0</span>
            Saatlik Kazanç
        </div>
    </div>

    <!-- Skor -->
    <div class="score-container">
        <div id="score">0</div>
        <div class="level-text">BAKİYE</div>
    </div>

    <!-- Coin -->
    <div class="coin-wrapper">
        <img id="coin" src="https://em-content.zobj.net/source/apple/355/coin_1fa99.png" alt="Coin">
    </div>

    <!-- Alt Kontroller -->
    <div class="controls">
        
        <!-- Enerji -->
        <div class="energy-info">
            <span>⚡ Enerji</span>
            <span id="energy-text">1000 / 1000</span>
        </div>
        <div class="progress-bar-bg">
            <div id="energy-bar" class="progress-bar-fill"></div>
        </div>

        <!-- Ana Butonlar -->
        <div class="buttons-row">
            <button id="inviteBtn" class="btn btn-invite">📢 Davet</button>
            <button id="saveBtn" class="btn btn-save">💾 Kaydet</button>
            <button id="boostBtn" class="btn btn-boost">
                🚀 Boost <span id="boost-count" style="font-size: 10px">(3/3)</span>
                <div id="boost-overlay" class="boost-timer">60</div>
            </button>
        </div>
        
        <!-- Cüzdan Butonu (Geri Geldi!) -->
        <button id="walletBtn" class="btn btn-wallet">👛 Cüzdan Bağla</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Bot Kullanıcı Adı
        const botUsername = 'ThatsCoin_bot'; 
        const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 'test-user';

        // Elementler
        const scoreEl = document.getElementById('score');
        const coinEl = document.getElementById('coin');
        const energyBarEl = document.getElementById('energy-bar');
        const energyTextEl = document.getElementById('energy-text');
        const boostBtn = document.getElementById('boostBtn');
        const boostCountEl = document.getElementById('boost-count');
        const boostOverlay = document.getElementById('boost-overlay');
        const levelDisplayEl = document.getElementById('level-display');
        const coinWrapper = document.querySelector('.coin-wrapper');

        // Oyun Değişkenleri
        let score = Number(localStorage.getItem('score')) || 0;
        let energy = Number(localStorage.getItem('energy')) || 1000;
        let maxEnergy = 1000;
        let dailyBoosts = Number(localStorage.getItem('dailyBoosts')) || 3;
        let lastBoostDate = localStorage.getItem('lastBoostDate');
        
        let isBoostActive = false; 

        // Günlük Boost Sıfırlama
        const today = new Date().toDateString();
        if (lastBoostDate !== today) {
            dailyBoosts = 3;
            localStorage.setItem('dailyBoosts', 3);
            localStorage.setItem('lastBoostDate', today);
        }

        updateUI();

        // ----- TIKLAMA YÖNETİCİSİ (Hem PC hem Mobil) -----
        
        // 1. Dokunmatik (Mobil) - Multi-touch
        coinEl.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Kaydırmayı engelle

            // SADECE BOOST AKTİFSE tüm parmakları say
            if (isBoostActive) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    handleTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                }
            } else {
                // Boost kapalıysa sadece ilk dokunuşu (tek parmak) al
                if (e.changedTouches.length > 0) {
                    handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
            }
        }, { passive: false });

        // 2. Mouse (Bilgisayar) - Tek Tık
        coinEl.addEventListener('mousedown', (e) => {
            handleTap(e.clientX, e.clientY);
        });

        // Ortak Tıklama Fonksiyonu
        function handleTap(x, y) {
            // Enerji kontrolü (Boost aktifse enerjiye bakma!)
            if (!isBoostActive && energy <= 0) return;

            score++;
            
            if (!isBoostActive) {
                energy--;
            }

            updateUI();
            showFloatingText(x, y);
            
            // Görsel efekt (JS ile basit küçültme, CSS active yetmeyebilir)
            coinEl.style.transform = "scale(0.95)";
            setTimeout(() => coinEl.style.transform = "scale(1)", 100);

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // ----- BOOST SİSTEMİ -----
        
        boostBtn.addEventListener('click', () => {
            if (isBoostActive) return; 
            if (dailyBoosts <= 0) {
                tg.showAlert("Bugünkü boost hakların bitti! Yarın gel.");
                return;
            }
            activateBoost();
        });

        function activateBoost() {
            isBoostActive = true;
            dailyBoosts--;
            localStorage.setItem('dailyBoosts', dailyBoosts);
            updateUI();

            document.body.classList.add('boost-active');
            boostOverlay.style.display = 'flex';
            
            let timeLeft = 60; 
            boostOverlay.innerText = timeLeft;

            const timer = setInterval(() => {
                timeLeft--;
                boostOverlay.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    deactivateBoost();
                }
            }, 1000);
        }

        function deactivateBoost() {
            isBoostActive = false;
            document.body.classList.remove('boost-active');
            boostOverlay.style.display = 'none';
            tg.showAlert("Boost bitti!");
        }

        // ----- UI GÜNCELLEME -----

        function updateUI() {
            scoreEl.innerText = score.toLocaleString();
            energyTextEl.innerText = `${energy} / ${maxEnergy}`;
            energyBarEl.style.width = (energy / maxEnergy * 100) + '%';
            
            // Seviye
            if (score >= 1000000) levelDisplayEl.innerText = "PLATINUM 💎";
            else if (score >= 100000) levelDisplayEl.innerText = "GOLD 🥇";
            else if (score >= 10000) levelDisplayEl.innerText = "SILVER 🥈";
            else levelDisplayEl.innerText = "BRONZE 🥉";

            // Boost butonu
            boostCountEl.innerText = `(${dailyBoosts}/3)`;
            
            localStorage.setItem('score', score);
            localStorage.setItem('energy', energy);
        }

        function showFloatingText(x, y) {
            const text = document.createElement('div');
            text.className = 'click-anim';
            text.innerText = '+1';
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }

        // Enerji Yenileme
        setInterval(() => {
            if (!isBoostActive && energy < maxEnergy) {
                energy++;
                updateUI();
            }
        }, 1000);

        // Buton Olayları
        document.getElementById('saveBtn').addEventListener('click', () => {
            const data = JSON.stringify({ score: score });
            tg.sendData(data);
            tg.close();
        });

        document.getElementById('inviteBtn').addEventListener('click', () => {
            const link = `https://t.me/${botUsername}?start=${userId}`;
            const msg = `That Coin oyna ve kazan! Link: ${link}`;
            const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        });

        document.getElementById('walletBtn').addEventListener('click', () => {
            tg.showAlert("Cüzdan bağlama özelliği çok yakında!");
        });

    </script>
</body>
</html>
